---
# The global properties are used to configure multiple charts at once.
global:
  # -- Container registry address.
  imageRegistry: "docker.io"

  # -- Credentials to fetch images from private registry.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  #
  # imagePullSecrets:
  #   - "docker-registry"
  #
  imagePullSecrets: []

  # -- fully qualified domain name of this impress instance
  fqdn: ""

  # -- TLS secret name
  tlsSecretName: ""

  collaborationServerSecret:
    # -- Value of collaboration server secret
    value: ""
    existingSecret:
      # -- Name of existing secret containing collaboration server secret, overrides provided value
      name: ""
      # -- Key where collaboration server secret is stored
      key: "collaborationServerSecret"

  yProviderApiKey:
    # -- Value of Y Provider API key
    value: ""
    existingSecret:
      # -- Name of existing secret containing Y Provider API key, overrides provided value
      name: ""
      # -- Key where Y Provider API key is stored
      key: "yProviderApiKey"

# -- Additional custom annotations to add to all deployed objects.
additionalAnnotations: {}

# -- Additional custom labels to add to all deployed objects.
additionalLabels: {}

# -- Affinity for pod assignment.
# Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
# Note: podAffinityPreset, podAntiAffinityPreset, and nodeAffinityPreset will be ignored when it's set.
affinity: {}

cleanup:
  # -- Whether to delete successfully run pods (e.g. jobs)
  deletePodsOnSuccess: false

# Security Context.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
containerSecurityContext:
  # -- Enable container privileged escalation.
  allowPrivilegeEscalation: false

  # -- Security capabilities for container.
  capabilities:
    drop:
      - "ALL"

  # -- Enable security context.
  enabled: true

  # -- Run container in privileged mode
  privileged: false

  # -- Process user id.
  runAsUser: 1001

  # -- Process group id.
  runAsGroup: 1001

  # Set Seccomp profile.
  seccompProfile:
    # -- Disallow custom Seccomp profile by setting it to RuntimeDefault.
    type: "RuntimeDefault"

  # -- Mounts the container's root filesystem as read-only.
  readOnlyRootFilesystem: true

  # -- Run container as a user.
  runAsNonRoot: true

# -- Array with extra environment variables to add to containers.
#
# extraEnvVars:
#   - name: FOO
#     value: "bar"
#
extraEnvVars: []

# -- Optionally specify an extra list of additional volumes.
extraVolumes: []

# -- Optionally specify an extra list of additional volumeMounts.
extraVolumeMounts: []

# -- Provide a name to substitute for the full names of resources.
fullnameOverride: ""

# Container image section.
image:
  # -- Container registry address. This setting has higher precedence than global.registry.
  registry: ""

  # -- Container repository string.
  repository: "lasuite/impress-backend"

  # -- Define an ImagePullPolicy.
  #
  # Ref.: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
  #
  # "IfNotPresent" => The image is pulled only if it is not already present locally.
  # "Always" => Every time the kubelet launches a container, the kubelet queries the container image registry to
  #             resolve the name to an image digest. If the kubelet has a container image with that exact digest cached
  #             locally, the kubelet uses its cached image; otherwise, the kubelet pulls the image with the resolved
  #             digest, and uses that image to launch the container.
  # "Never" => The kubelet does not try fetching the image. If the image is somehow already present locally, the
  #            kubelet attempts to start the container; otherwise, startup fails.
  #
  imagePullPolicy: "IfNotPresent"

  # -- Define image tag.
  tag: "v3.3.0@sha256:64b070ba83df9af83c5e6163a1a309f6ec3ad8c5be31e1fbc8212379fccf6e6e"

# -- Credentials to fetch images from private registry.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
#
# imagePullSecrets:
#   - "docker-registry"
#
imagePullSecrets: []

# Define and create Kubernetes Ingress.
#
# Ref.: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  # -- Enable creation of Ingress.
  enabled: true

  # -- Define the Fully Qualified Domain Name (FQDN) where application should be reachable.
  host: ""

  # -- Define the Ingress path.
  path: "/api"

  # -- Each path in an Ingress is required to have a corresponding path type.
  # Paths that do not include an explicit pathType will fail validation.
  # There are three supported path types:
  #
  # "ImplementationSpecific" => With this path type, matching is up to the IngressClass. Implementations can treat this
  #                             as a separate pathType or treat it identically to Prefix or Exact path types.
  # "Exact" => Matches the URL path exactly and with case sensitivity.
  # "Prefix" => Matches based on a URL path prefix split by /.
  #
  # Ref.: https://kubernetes.io/docs/concepts/services-networking/ingress/#path-types
  pathType: "Prefix"

  # -- The Ingress controller class name.
  ingressClassName: "nginx"

  # -- Define custom ingress annotations.
  # annotations:
  #   nginx.ingress.kubernetes.io/rewrite-target: /
  annotations: {}

  # -- Secure an Ingress by specifying a Secret that contains a TLS private key and certificate.
  #
  # Ref.: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  tls:
    # -- Enable TLS/SSL/HTTPS for Ingress.
    enabled: true

    # -- The name of the kubernetes secret which contains a TLS private key and certificate.
    # Hint: This secret is not created by this chart and must be provided.
    secretName: ""

# Define and create Kubernetes Ingress for admin area.
#
# Ref.: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingressAdmin:
  # -- Enable creation of Ingress.
  enabled: false

  # -- Define the Fully Qualified Domain Name (FQDN) where application should be reachable.
  host: ""

  # -- Define the Ingress path.
  path: "/admin"

  # -- Each path in an Ingress is required to have a corresponding path type.
  # Paths that do not include an explicit pathType will fail validation.
  # There are three supported path types:
  #
  # "ImplementationSpecific" => With this path type, matching is up to the IngressClass. Implementations can treat this
  #                             as a separate pathType or treat it identically to Prefix or Exact path types.
  # "Exact" => Matches the URL path exactly and with case sensitivity.
  # "Prefix" => Matches based on a URL path prefix split by /.
  #
  # Ref.: https://kubernetes.io/docs/concepts/services-networking/ingress/#path-types
  pathType: "Prefix"

  # -- The Ingress controller class name.
  ingressClassName: "nginx"

  # -- Define custom ingress annotations.
  # annotations:
  #   nginx.ingress.kubernetes.io/rewrite-target: /
  annotations: {}

  # -- Secure an Ingress by specifying a Secret that contains a TLS private key and certificate.
  #
  # Ref.: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  tls:
    # -- Enable TLS/SSL/HTTPS for Ingress.
    enabled: true

    # -- The name of the kubernetes secret which contains a TLS private key and certificate.
    # Hint: This secret is not created by this chart and must be provided.
    secretName: ""

# -- Lifecycle to automate configuration before or after startup.
lifecycleHooks: {}

# -- String to partially override release name.
nameOverride: ""

# -- Node labels for pod assignment.
# Ref: https://kubernetes.io/docs/user-guide/node-selection/
nodeSelector: {}

#  Configure extra options for containers probes.
livenessProbe:
  # -- Enables kubernetes LivenessProbe.
  enabled: true
  # -- Number of failed executions until container is terminated.
  failureThreshold: 10
  # -- Delay after container start until LivenessProbe is executed.
  initialDelaySeconds: 15
  # -- Time between probe executions.
  periodSeconds: 20
  # -- Number of successful executions after failed ones until container is marked healthy.
  successThreshold: 1
  # -- Timeout for command return.
  timeoutSeconds: 5

# -- Pod disruption budget
# Ref.: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
pdb:
  # -- Whether PodDisruptionBudget for the backend should be enabled
  enabled: true
  # -- How many pods need to be available at any given time
  minAvailable: 1
  # -- How many pods can be unavailable at any given time
  maxUnavailable: ~

# -- Pod Annotations.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

# -- Pod Annotations for Create User Job.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotationsCreateUser: {}

# -- Pod Annotations for Migrate Job.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotationsMigrate: {}

# -- Pod Labels.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Pod Security Context.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
podSecurityContext:
  # -- Enable security context.
  enabled: true

  # -- If specified, all processes of the container are also part of the supplementary group.
  fsGroup: 1000

  # -- Change ownership and permission of the volume before being exposed inside a Pod.
  fsGroupChangePolicy: "Always"

#  Configure extra options for containers probes.
readinessProbe:
  # -- Enables kubernetes ReadinessProbe.
  enabled: true
  # -- Delay after container start until ReadinessProbe is executed.
  initialDelaySeconds: 15
  # -- Number of failed executions until container is terminated.
  failureThreshold: 10
  # -- Time between probe executions.
  periodSeconds: 20
  # -- Number of successful executions after failed ones until container is marked healthy.
  successThreshold: 1
  # -- Timeout for command return.
  timeoutSeconds: 5

# -- Set the amount of replicas of deployment.
replicaCount: 1

# Configure resource requests and limits.
#
# Ref: https://kubernetes.io/docs/user-guide/compute-resources/
resources:
  limits:
    # -- The max number of CPUs to consume.
    cpu: 1
    # -- The max number of RAM to consume.
    memory: "1Gi"
  requests:
    # -- The number of CPUs which has to be available on the scheduled node.
    cpu: "100m"
    # -- The number of RAM which has to be available on the scheduled node.
    memory: "512Mi"

# Define and create Kubernetes Service.
#
# Ref.: https://kubernetes.io/docs/concepts/services-networking/service
service:
  # -- Additional custom annotations.
  annotations: {}

  # -- Enable kubernetes service creation.
  enabled: true

  # "ClusterIP" => Exposes the Service on a cluster-internal IP. Choosing this value makes the Service only reachable
  #                from within the cluster. This is the default that is used if you don't explicitly specify a type for
  #                a Service.
  # "NodePort" => Exposes the Service on each Node's IP at a static port (the NodePort). To make the node port
  #               available, Kubernetes sets up a cluster IP address, the same as if you had requested a Service of
  #               type: ClusterIP.
  # "LoadBalancer" => Exposes the Service externally using a cloud provider's load balancer.
  #
  # Ref.: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types

  # -- Choose the kind of Service, one of "ClusterIP", "NodePort" or "LoadBalancer".
  type: "ClusterIP"

  # Define the ports of Service.
  # You can set the port value to an arbitrary value, it will map the container port by name.
  #
  ports:
    http:
      # -- Accessible port.
      port: 80
      # -- Internal port.
      containerPort: 8000
      # -- Service protocol.
      protocol: "TCP"

# Service account to use.
# Ref.: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
serviceAccount:
  # -- Additional custom annotations for the ServiceAccount.
  annotations: {}

  # -- Allows auto mount of ServiceAccountToken on the serviceAccount created. Can be set to false if pods using this
  # serviceAccount do not need to use K8s API.
  automountServiceAccountToken: false

  # -- Enable creation of ServiceAccount for pod.
  create: true

  # -- Additional custom labels for the ServiceAccount.
  labels: {}

#  Configure extra options for containers probes.
startupProbe:
  # -- Enables kubernetes StartupProbe.
  enabled: true
  # -- Delay after container start until StartupProbe is executed.
  initialDelaySeconds: 15
  # -- Number of failed executions until container is terminated.
  failureThreshold: 10
  # -- Time between probe executions.
  periodSeconds: 20
  # -- Number of successful executions after failed ones until container is marked healthy.
  successThreshold: 1
  # -- Timeout for command return.
  timeoutSeconds: 5

# -- In seconds, time the given to the pod needs to terminate gracefully.
# Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod/#termination-of-pods
terminationGracePeriodSeconds: ""

# -- Tolerations for pod assignment.
# Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

# -- Topology spread constraints rely on node labels to identify the topology domain(s) that each Node is in.
# Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
#
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: failure-domain.beta.kubernetes.io/zone
#     whenUnsatisfiable: DoNotSchedule
topologySpreadConstraints: []

# Set up update strategy.
#
# Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
#
# Example:
# updateStrategy:
#  type: RollingUpdate
#  rollingUpdate:
#    maxSurge: 25%
#    maxUnavailable: 25%
updateStrategy:
  # -- Set to Recreate if you use persistent volume that cannot be mounted by more than one pods to make sure the pods
  # are destroyed first.
  type: "RollingUpdate"

configuration:
  # -- Override default command
  command: []
    # - "gunicorn"
    # - "-c"
    # - "/usr/local/etc/gunicorn/impress.py"
    # - "impress.wsgi:application"
    # - "--reload"

  # -- Override default args
  args: []

  database:
    # -- Database engine, default django.db.backends.postgresql_psycopg2
    engine: ""
    # -- Database name
    name: "notes"
    user:
      # -- Value of database user
      value: "dinum"
      existingSecret:
        # -- Name of existing secret with database user, overrules provided value
        name: ~
        # -- Key where database user is stored
        key: "dbUser"
    password:
      # -- Value of database password
      value: ""
      existingSecret:
        # -- Name of existing secret containing database password, overrules provided value
        name: ~
        # -- Key where database password is stored
        key: "dbPassword"
    # -- Database hostname or ip address
    host: "localhost"
    # -- Database port
    port: 5432

  django:
    # -- List of strings representing the host/domain names that this Django site can serve
    allowedHosts: "*"
    # -- List of trusted origins for unsafe requests (e.g. POST)
    csrfTrustedOrigins: ""
    # -- Domain of this site, will default to global.fqdn
    siteDomain: ""
    # -- Name of this site
    siteName: ""
    # -- Django configuration
    configuration: "Production"
    secretKey:
      # -- Value of Django secret key
      value: ""
      existingSecret:
        # -- Name of existing secret containing Django secret key, overrules provided value
        name: ~
        # -- Key where Django secret key is stored
        key: "djangoSecretKey"
    # -- Django settings module
    settingsModule: "impress.settings"
    superuserEmail:
      # -- Email of superuser
      value: "admin@default"
      existingSecret:
        # -- Name of existing secret containing the superuser email, overrules provided value
        name: ~
        # -- Key where superuser email is stored
        key: "djangoSuperuserEmail"
    superuserPassword:
      # -- Superuser password
      value: ""
      existingSecret:
        # -- Name of existing key containing superuser password, overrules provided value
        name: ~
        # -- Key where superuser password is stored
        key: "djangoSuperuserPassword"

  ai:
    apiKey:
      # -- Value of AI API Key
      value: ""
      existingSecret:
        # -- Name of existing secret containing AI API key, overrules provided value
        name: ~
        # -- Key where AI API Key is stored
        key: "aiApiKey"
    # -- Base URL of AI
    baseUrl: ""
    # -- AI Model
    model: ""
    # -- Allow AI requests from public, authenticated or restricted
    allowReachFrom: ""

  aws:
    # -- AWS endpoint URL
    endpointUrl: ""
    s3AccessKeyId:
      # -- Value of S3 Access Key ID
      value: ""
      existingSecret:
        # -- Name of existing secret containing S3 Access Key Id, overrules provided value
        name: ""
        # -- Key where S3 Access Key ID is stored
        key: "awsS3AccessKeyId"
    s3SecretAccessKey:
      # -- Value of S3 Secret Access Key
      value: ""
      existingSecret:
        # -- Name of existing secret containing S3 Secret Access Key, overrules provided value
        name: ~
        # -- Key where S3 Secret Access Key is stored
        key: "awsS3SecretAccessKey"
    # -- S3 region name
    regionName: ""
    # -- S3 bucket name
    storageBucketName: "notes"

  collaboration:
    # -- Collaboration API URL
    apiUrl: ""
    # -- Collaboration websocket URL
    wsUrl: ""

  email:
    # -- Email brand name
    brandName: ""
    # -- Path to email logo
    logoImage: ""
    # -- From address
    from: ""
    # -- SMTP relay server
    host: "postfix"
    # -- SMTP relay port
    port: 25
    # -- Use SSL
    useSSL: "False"
    # -- Use TLS
    useTLS: "False"
    user:
      # -- Value of email user to authenticate with
      value: ""
      existingSecret:
        # -- Name of existing secret containing the email user name, overrules provided value
        name: ~
        # -- Key where email user is stored
        key: "djangoEmailHostUser"
    password:
      # -- Value of email user password
      value: ""
      existingSecret:
        # -- Name of existing secret containing the password of the user, overrules provided value
        name: ~
        # -- Key where email password is stored
        key: "djangoEmailHostPassword"

  # -- Name of the frontend theme
  frontendTheme: ""
  # -- Media Base URL
  mediaBaseUrl: ""
  # -- Max size of images in bytes
  documentImageMaxSize: ~
  redisUrl:
    # -- Value of Redis URL, e.g. redis://user:password@redis:6379/1
    value: ""
    existingSecret:
      # -- Name of existing secret containing Redis URL, overrules provided value
      name: ~
      # -- Key where Redis URL is stored
      key: "redisUrl"
  # -- Days after items in trash will be permamently deleted
  trashbinCutoffDays: "30"

  init:
    createSuperuser:
      # -- Whether if a superuser should be created
      enabled: true
      # -- Command to create a superuser, ${DJANGO_SUPERUSER_EMAIL} and ${DJANGO_SUPERUSER_PASSWORD} env vars need to be set
      command: >
        python manage.py createsuperuser --email "${DJANGO_SUPERUSER_EMAIL}" --password "${DJANGO_SUPERUSER_PASSWORD}"
    migrate:
      # -- Whether to enable migration
      enabled: true
      # -- Command for migrations
      command: >
        python manage.py migrate --no-input
    # -- Init job restart policy
    restartPolicy: "Never"

  oidc:
    # -- Whether to enable OIDC
    enabled: false
    # -- Whether to create User
    createUser: "True"
    # -- Relying Party signature algorithm, default `RS256`
    rpSignAlgo: "RS256"
    rpClientId:
      # -- Relying Party client ID
      value: "impress"
      existingSecret:
        # -- Name of existing secret containing client ID, overrules provided value
        name: ~
        # -- Key where client ID is stored
        key: "oidcRpClientId"
    rpClientSecret:
      # -- Relying Party client secret
      value: ""
      existingSecret:
        # -- Name of existing secret containing client secret, overrules provided value
        name: ~
        # -- Key where client secret is stored
        key: "oidcRpClientSecret"
    # -- Relying Party scopes
    rpScopes: "openid email"
    # -- JWKS endpoint
    opJWKSEndpoint: ""
    # -- Authorization endpoint
    opAuthorizationEndpoint: ""
    # -- Token endpoint
    opTokenEndpoint: ""
    # -- User endpoint
    opUserEndpoint: ""
    # -- Logout endpoint
    opLogoutEndpoint: ""
    # -- Auth Request extra parameters
    authRequestExtraParams: "{}"
    # -- Use Nonce
    useNonce: "True"
    # -- Require HTTPS for redirects
    redirectRequireHTTPS: "False"
    # -- Allowed Hosts to redirect to
    redirectAllowedHosts: "[]"
    # -- Whether to store ID token
    storeIDToken: "True"
    # -- Fallback to email for identification
    fallbackToEmailForIdentification: "True"
    # -- Whether to allow duplicate emails
    allowDuplicateEmails: "False"
    # -- Essential claims
    essentialClaims: "email"
    # -- Fields to full name
    fullnameFields: "first_name last_name"
    # -- Field to short name
    shortnameField: "first_name"
    # -- Redirect URL after login
    loginRedirectUrl: ""
    # -- Redirect URL on failure
    loginRedirectUrlFailure: ""
    # -- Redirect URL after logout
    logoutRedirectUrl: ""
    # -- Allow logout request with `GET`
    allowLogoutGetMethod: "True"

  yProvider:
    # -- API Base URL
    apiBaseUrl: ""
...
