{{- if .Values.pdb.enabled }}
---
kind: "PodDisruptionBudget"
apiVersion: {{ include "common.capabilities.policy.apiVersion" . }}
metadata:
  name: {{ include "common.names.fullname" . | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  {{- if .Values.pdb.minAvailable }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- end }}
  {{- if or .Values.pdb.maxUnavailable ( not .Values.pdb.minAvailable ) }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
    # The init Job's pods carry the same standard labels as the Deployment's
    # pods. A PodDisruptionBudget cannot resolve a Job as a scale target, so
    # once a finished init pod matches the selector the PDB controller reports
    # `DisruptionAllowed=False (SyncFailed)` and every drain of the backend's
    # node is refused. Job-owned pods always carry batch.kubernetes.io/job-name;
    # keep them out of the budget.
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: DoesNotExist
...
{{- end }}
