---
kind: "ConfigMap"
apiVersion: "v1"
metadata:
  name: "{{ include "common.names.fullname" . }}"
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  default.conf: |
    server {
        ### START: taken from https://github.com/suitenumerique/docs/blob/main/src/frontend/apps/impress/conf/default.conf ###
        server_name {{ .Values.global.fqdn }};
        root /usr/share/nginx/html;
        listen 8080;
        error_page 404 /404.html;

        location / {
            try_files $uri index.html $uri/index.html =404;
            add_header X-Frame-Options DENY always;
        }

        location ~ "^/docs/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
            try_files $uri /docs/[id]/index.html;
            add_header X-Frame-Options DENY always;
        }

        location = /404.html {
            internal;
        }

        # Health check endpoint for Kubernetes probes
        location = /healthz {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }
        ### END

        # Match /media/<anything>
        location ~ ^/media/(.*)$ {

            auth_request /_auth;

            # Capture auth response headers
            auth_request_set $auth_authorization $upstream_http_authorization;
            auth_request_set $auth_amz_date $upstream_http_x_amz_date;
            auth_request_set $auth_amz_sha $upstream_http_x_amz_content_sha256;

            # Rewrite URI to object store path; using rewrite+break with a static
            # proxy_pass (no URI, no variables) so nginx resolves the hostname at
            # config load time via /etc/resolv.conf — no explicit resolver needed.
            rewrite ^/media/(.*)$ /{{ .Values.global.s3.bucketName }}/$1 break;

            proxy_pass https://{{ .Values.global.s3.host }}:{{ .Values.global.s3.port }};

            proxy_ssl_server_name on;

            proxy_set_header Host {{ .Values.global.s3.host }};

            # Forward auth headers to objectstore
            proxy_set_header Authorization $auth_authorization;
            proxy_set_header X-Amz-Date $auth_amz_date;
            proxy_set_header X-Amz-Content-SHA256 $auth_amz_sha;

            # Strip Referer so objectstore bucket policies don't reject cross-domain requests
            proxy_set_header Referer "";

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---- AUTH ENDPOINT ----
        location = /_auth {
            internal;

            # Route directly to the internal backend service (avoids hairpin through public FQDN/Ingress)
            proxy_pass http://{{ .Values.configuration.backendHost }}:{{ .Values.configuration.backendPort }}/api/v1.0/documents/media-auth/;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host {{ .Values.global.fqdn }};
            proxy_set_header X-Original-URL $request_uri;
            proxy_set_header X-Forwarded-Proto "https";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host {{ .Values.global.fqdn }};

            # Forward auth headers back
            proxy_pass_header Authorization;
            proxy_pass_header X-Amz-Date;
            proxy_pass_header X-Amz-Content-SHA256;
        }
    }
  nginx.conf: |
    worker_processes  {{ .Values.configuration.webserver.workerProcesses }};
    error_log  /var/log/nginx/error.log {{ .Values.configuration.webserver.loglevel }};
    pid        /run/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  65;

        #gzip  on;

        include /etc/nginx/conf.d/*.conf;
    }

...
